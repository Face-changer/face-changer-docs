<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Face Surgery Simulator — Docs</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--void:#0a0908;--charcoal:#1a1714;--slate:#3a352f;--gold:#d4af37;--gold-deep:#8b7355;--cream:#e8e4de;--sand:#8a857f;--serif:"Cormorant Garamond",Georgia,serif;--sans:"DM Sans",system-ui,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:var(--void);color:var(--cream);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
.container{text-align:center;padding:40px}
.badge{font:500 10px var(--sans);letter-spacing:3px;text-transform:uppercase;color:var(--gold);border:1px solid var(--gold-deep);padding:6px 20px;border-radius:24px;display:inline-block;margin-bottom:32px}
h1{font:300 48px/1.15 var(--serif);color:var(--cream);margin-bottom:12px}
h1 span{color:var(--gold)}
p{font:300 16px/1.7 var(--sans);color:var(--sand);max-width:480px;margin:0 auto 48px}
.langs{display:flex;gap:20px;justify-content:center}
.lang-btn{display:flex;flex-direction:column;align-items:center;gap:12px;padding:32px 48px;background:var(--charcoal);border:1px solid var(--slate);border-radius:16px;text-decoration:none;transition:all .3s;min-width:180px}
.lang-btn:hover{border-color:var(--gold);transform:translateY(-4px);box-shadow:0 12px 40px rgba(212,175,55,.12)}
.lang-flag{font-size:36px}
.lang-name{font:500 18px var(--serif);color:var(--cream)}
.lang-sub{font:300 12px var(--sans);color:var(--sand);letter-spacing:.5px}
.divider{width:60px;height:1px;background:linear-gradient(90deg,transparent,var(--gold-deep),transparent);margin:48px auto}
.footer{font:300 11px var(--sans);color:var(--slate);letter-spacing:.5px}
.footer a{color:var(--gold-deep);text-decoration:none}
</style>
</head>
<body>
<div class="container">
  <div class="badge">ATELIER DOCS</div>
  <h1>Face Surgery <span>Simulator</span></h1>
  <p>3D face simulation platform for nose, lip, and chin ROI modification with AI refinement</p>
  <div class="langs">
    <a class="lang-btn" href="en.html">
      <div class="lang-flag">EN</div>
      <div class="lang-name">English</div>
      <div class="lang-sub">Documentation</div>
    </a>
    <a class="lang-btn" href="ko.html">
      <div class="lang-flag">KO</div>
      <div class="lang-name">한국어</div>
      <div class="lang-sub">문서 포털</div>
    </a>
  </div>
  <div class="divider"></div>
  <div class="footer">Built with Atelier Docs Engine · <a href="https://github.com/Face-changer/face-changer-docs">GitHub</a></div>
</div>
</body>
</html>
